<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページ編集</title>
<style>
  :root{
    --bg:#E6E9EC;       /* 作業机のグレー */
    --sheet:#FFFFFF;    /* 紙 */
    --ink:#1E2830;      /* 本文 */
    --muted:#66727C;    /* 裏足 */
    --line:#C9CFD5;     /* 罫 */
    --accent:#2457C5;   /* 操作色 */
    --warn:#B3261E;     /* エラー */
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"BIZ UDPGothic","Yu Gothic UI","Meiryo",system-ui,sans-serif;
    font-size:15px;line-height:1.55;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 40px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
  h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.02em}
  h2{font-size:14px;margin:0;font-weight:700}
  .count{color:var(--muted);font-size:13px}

  /* 共通タブ */
  .tabs{display:flex;gap:2px;margin:0 0 22px;border-bottom:1px solid var(--line)}
  .tabs a{
    font-size:13px;text-decoration:none;color:var(--muted);padding:7px 14px;
    border:1px solid transparent;border-bottom:none;border-radius:4px 4px 0 0;
    position:relative;top:1px;
  }
  .tabs a:hover{color:var(--ink);background:#EDF0F3}
  .tabs a.is-current{
    background:var(--sheet);border-color:var(--line);border-bottom-color:var(--sheet);
    color:var(--ink);font-weight:700;
  }

  /* ドロップ面：紙の束 */
  .drop{
    position:relative;background:var(--sheet);border:1.5px dashed var(--line);
    border-radius:6px;padding:26px 20px;text-align:center;cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .drop::before,.drop::after{
    content:"";position:absolute;inset:0;border-radius:6px;background:var(--sheet);
    border:1px solid var(--line);z-index:-1;
  }
  .drop::before{transform:translate(5px,5px)}
  .drop::after{transform:translate(10px,10px);opacity:.6}
  .drop:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  body.dragging .drop{border-color:var(--accent);background:#F1F5FD}
  .drop strong{font-size:17px;display:block}
  .drop span{color:var(--muted);font-size:13px}
  .drop-wrap{position:relative;z-index:0;margin-bottom:28px}

  .filebar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .fname{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
  .panel{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:14px}
  .panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .hint{color:var(--muted);font-size:12px}

  .rangebar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .rangebar input{
    font:inherit;font-size:13px;flex:1;min-width:150px;padding:5px 8px;
    border:1px solid var(--line);border-radius:4px;background:var(--sheet);color:var(--ink);
  }

  /* ページチップ */
  .chips{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:4px;
    max-height:330px;overflow:auto;padding:8px;border:1px solid var(--line);
    border-radius:4px;background:#FAFBFC;
  }
  .chip{
    position:relative;font:inherit;font-size:12px;font-variant-numeric:tabular-nums;
    padding:7px 2px 12px;border:1px solid var(--line);border-radius:3px;background:var(--sheet);
    color:var(--ink);cursor:pointer;text-align:center;user-select:none;line-height:1.2;
  }
  .chip:hover{border-color:var(--ink)}
  .chip.sel{background:#E8EFFC;border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .chip.del{color:var(--warn);text-decoration:line-through;background:#FBEEEC;border-color:#E0B4AF}
  .chip.del.sel{box-shadow:inset 0 0 0 1px var(--accent)}
  /* 1クリック目の「起点」＝太枠。2クリック目で選択に変わり太枠は外れる */
  .chip.anchor{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
  .chip .rot{
    position:absolute;left:0;right:0;bottom:1px;font-size:9px;color:var(--accent);font-weight:700;
  }

  .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .acts .sep{width:1px;height:20px;background:var(--line)}
  .acts .grp{display:flex;gap:6px}
  .summary{margin-top:6px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .summary b{color:var(--ink)}
  .pnote{margin-top:10px;min-height:1.4em;font-size:13px;color:var(--muted)}
  .pnote.err{color:var(--warn);font-weight:700}
  .pnote.ok{color:#1F6E3A}

  .viewer .stage{
    position:relative;width:100%;height:420px;border:1px solid var(--line);border-radius:4px;
    background:#F2F3F5;overflow:auto;padding:8px;
  }
  .viewer .stage canvas{display:block;margin:0 auto;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.22)}
  .viewer .stage.busy canvas{opacity:.55}
  .vmsg{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:13px;text-align:center;padding:16px;
  }
  .vmode{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
  .vmode button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .vmode .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
  .vmode select{
    font:inherit;font-size:13px;padding:5px 6px;border:1px solid var(--line);
    border-radius:4px;background:var(--sheet);color:var(--ink);
  }
  .vmode .nav{padding:5px 8px;min-width:30px;font-size:12px;line-height:1}
  .vpage{
    font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;
    min-width:58px;text-align:center;user-select:none;
  }
  .vnote{margin-top:8px;font-size:12px;color:var(--muted);min-height:2.6em}
  .ver{font-size:11px;font-weight:400;color:var(--muted);margin-left:8px;letter-spacing:0}

  button{
    font:inherit;font-size:13px;color:var(--ink);background:var(--sheet);
    border:1px solid var(--line);border-radius:4px;padding:5px 10px;cursor:pointer;
  }
  button:hover:not(:disabled){border-color:var(--ink)}
  button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
  button:disabled{opacity:.4;cursor:default}
  button.danger{color:var(--warn)}
  button.danger:hover:not(:disabled){border-color:var(--warn)}

  .out{margin-top:22px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .out label{font-size:13px;color:var(--muted)}
  .out input{
    font:inherit;flex:1;min-width:220px;padding:8px 10px;border:1px solid var(--line);
    border-radius:4px;background:var(--sheet);color:var(--ink);
  }
  button.primary{
    background:var(--accent);border-color:var(--accent);color:#fff;font-size:15px;
    padding:9px 22px;font-weight:700;
  }
  button.primary:hover:not(:disabled){background:#1C47A6;border-color:#1C47A6}
  .status{margin-top:12px;min-height:1.5em;font-size:13px;color:var(--muted)}
  .status.err{color:var(--warn)}
  .status.ok{color:#1F6E3A}

  /* 並べ替え */
  .chip[draggable="true"]{cursor:grab}
  .chip.moving{opacity:.35}
  .chip.over-left{box-shadow:inset 3px 0 0 var(--accent)}
  .chip.over-right{box-shadow:inset -3px 0 0 var(--accent)}

  .out select{
    font:inherit;font-size:13px;padding:7px 8px;border:1px solid var(--line);
    border-radius:4px;background:var(--sheet);color:var(--ink);
  }
  .out #splitArg{flex:0 1 240px;min-width:160px;font-size:13px;padding:7px 9px}
  .splitinfo{margin-top:8px;font-size:13px;color:var(--muted)}
  .splitinfo.err{color:var(--warn);font-weight:700}

  @media (max-width:860px){
    .cols{grid-template-columns:1fr}
    .viewer .stage{height:320px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ページ編集<span class="ver">rev.8</span></h1>
    <div class="count" id="count"></div>
  </header>

  <nav class="tabs">
    <a href="index.html">ホーム</a>
    <a href="pdf-merge.html">PDF結合</a>
    <a href="pdf-edit.html" class="is-current" aria-current="page">ページ編集</a>
    <a href="zip2pdf.html">zip→PDF変換</a>
  </nav>

  <div class="drop-wrap" id="dropWrap">
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="PDFを読み込む">
      <strong>PDFをここにドロップ</strong>
      <span>またはクリックして選択（1ファイル）。ページの削除・回転・並べ替え・抽出ができます。</span>
    </div>
    <input type="file" id="picker" accept="application/pdf,.pdf" hidden>
  </div>

  <div id="editor" hidden>
    <div class="filebar">
      <div class="fname" id="fname"></div>
      <button id="reload">別のPDFを読み込む</button>
    </div>

    <div class="cols">
      <section class="panel">
        <div class="panel-head">
          <h2>ページ</h2>
          <div class="hint">
            1回目＝起点／同じページをもう一度＝単独選択／別ページ＝範囲選択<br>
            ドラッグで並べ替え。番号はプレビューの表示内容に合わせて振り直されます
          </div>
        </div>
        <div class="rangebar">
          <input id="rangeInput" type="text" placeholder="例: 2, 5-8, 12" spellcheck="false">
          <button id="rangeSel">番号で選択</button>
          <button id="selAll">全選択</button>
          <button id="selNone">選択解除</button>
        </div>
        <div class="chips" id="chips"></div>
        <div class="acts">
          <button id="opDel" class="danger">削除</button>
          <button id="opUndel">削除を取消</button>
          <span class="sep"></span>
          <button id="rot90">⟳ 90°</button>
          <button id="rot180">⟳ 180°</button>
          <button id="rot270">⟳ 270°</button>
          <button id="rot0">回転を戻す</button>
          <span class="sep"></span>
          <span class="grp"><button id="moveUp">◀ 前へ</button><button id="moveDown">後ろへ ▶</button></span>
          <span class="sep"></span>
          <button id="resetAll">全変更を取消</button>
        </div>
        <div class="summary" id="summary"></div>
        <div class="pnote" id="pnote" role="status" aria-live="polite"></div>
      </section>

      <section class="panel viewer">
        <div class="panel-head">
          <h2>プレビュー</h2>
          <div class="vmode">
            <button id="pagePrev" class="nav" aria-label="前のページ" title="前のページ（PageUp）">▲</button>
            <span class="vpage" id="vpage">−&#8202;/&#8202;−</span>
            <button id="pageNext" class="nav" aria-label="次のページ" title="次のページ（PageDown）">▼</button>
            <select id="fitMode" aria-label="表示倍率" title="プレビューの表示倍率">
              <option value="Fit">ページ全体</option>
              <option value="FitH">幅に合わせる</option>
            </select>
            <span class="sep"></span>
            <button id="modeSrc">元のPDF</button>
            <button id="modeOut" class="on">編集結果</button>
            <button id="openTab">別タブで開く</button>
          </div>
        </div>
        <div class="stage" id="stage" role="img" aria-label="PDFプレビュー">
          <div class="vmsg" id="vmsg">PDFを読み込むとここに表示されます。</div>
        </div>
        <div class="vnote" id="vnote"></div>
      </section>
    </div>

    <div class="out">
      <label for="outMode">書き出し</label>
      <select id="outMode">
        <option value="all">残った全ページを1ファイル</option>
        <option value="sel">選択ページだけを1ファイル</option>
        <option value="every">Nページごとに分割</option>
        <option value="at">指定位置で分割</option>
      </select>
      <input id="splitArg" type="text" spellcheck="false" hidden>
      <label for="outName" id="outNameLabel">保存名</label>
      <input id="outName" type="text" spellcheck="false">
      <button class="primary" id="save">保存</button>
    </div>
    <div class="splitinfo" id="splitinfo"></div>
  </div>

  <div class="status" id="status" role="status" aria-live="polite"></div>
</div>

<script src="lib/pdf-lib.min.js"></script>
<script src="lib/pdf.min.js"></script>
<script>
(() => {
  const { PDFDocument, degrees } = PDFLib;
  const $ = id => document.getElementById(id);
  const statusEl = $('status');

  /* ページは配列の「順序」が出力順。各要素は元PDFのどのページかを src で持つ。
     選択や起点はオブジェクト参照で持つので、並べ替えても壊れない。 */
  let srcBytes = null;      // Uint8Array（元PDF、変更しない）
  let srcName  = '';
  let pages    = [];        // [{src, origRot, rot, del}]
  let sel      = new Set(); // ページオブジェクトの集合
  let anchor   = null;      // 1クリック目の起点
  let cursor   = null;      // 最後にクリックしたページ
  let srcUrl   = null;      // 元PDFの blob URL
  let outUrl   = null;      // 編集結果の blob URL
  let mode     = 'out';     // 既定は編集結果
  let outDirty = true;
  let viewPage = 1;         // プレビューで最後に表示させたページ（現在のモードでの番号）
  let fitMode  = 'Fit';     // 既定は「ページ全体」。再読込のたびにこの倍率に戻す

  const setStatus = (msg, kind = '') => {
    statusEl.textContent = msg;
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  };
  // 操作ボタンのすぐ下に出す、操作パネル用のメッセージ
  const setNote = (msg, kind = '') => {
    const el = $('pnote');
    el.textContent = msg;
    el.className = 'pnote' + (kind ? ' ' + kind : '');
  };
  const setVNote = msg => { $('vnote').textContent = msg; };

  /* ---------- ページ番号 ----------
     内部は常にページオブジェクト。画面に出す番号だけを、
     いまプレビューしている側の番号に合わせる。
     - 元のPDF  : 元PDFでのページ番号（並べ替えても変わらない）
     - 編集結果 : 出力順での連番（削除したページは番号なし＝「−」） */
  const kept = () => pages.filter(p => !p.del);

  function outNumbers() {
    const m = new Map();
    let n = 0;
    for (const p of pages) if (!p.del) m.set(p, ++n);
    return m;
  }

  // 表示番号 → ページオブジェクト
  function numberMap() {
    const m = new Map();
    if (mode === 'src') pages.forEach(p => m.set(p.src + 1, p));
    else outNumbers().forEach((v, p) => m.set(v, p));
    return m;
  }

  /* 「2, 5-8, 12」を、いま表示中の番号として解釈する */
  function parseRanges(text) {
    const map = numberMap();
    const max = map.size;
    const out = new Set();
    const bad = [];
    for (const raw of text.split(/[,、\s]+/)) {
      if (!raw) continue;
      const m = raw.match(/^(\d+)(?:\s*[-–~ー]\s*(\d+))?$/);
      if (!m) { bad.push(raw); continue; }
      let a = +m[1], b = m[2] ? +m[2] : a;
      if (a > b) [a, b] = [b, a];
      if (a < 1 || b > max) { bad.push(raw); continue; }
      for (let k = a; k <= b; k++) { const p = map.get(k); if (p) out.add(p); }
    }
    return { set: out, bad, max };
  }

  // 分割位置などの単純な番号リスト
  function parseNums(text, max) {
    const out = new Set(); const bad = [];
    for (const raw of text.split(/[,、\s]+/)) {
      if (!raw) continue;
      const n = /^\d+$/.test(raw) ? +raw : NaN;
      if (!Number.isFinite(n) || n < 1 || n > max) { bad.push(raw); continue; }
      out.add(n);
    }
    return { nums: [...out].sort((a, b) => a - b), bad };
  }

  /* ---------- 読み込み ---------- */
  async function loadFile(file) {
    if (!file) return;
    if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') {
      setStatus('PDFファイルではありません。', 'err'); return;
    }
    setStatus('読み込み中…');
    try {
      const bytes = new Uint8Array(await file.arrayBuffer());
      const doc = await PDFDocument.load(bytes, { ignoreEncryption: true });
      if (doc.isEncrypted) { setStatus('パスワード保護のため編集できません。', 'err'); return; }
      const n = doc.getPageCount();
      if (!n) { setStatus('ページがありません。', 'err'); return; }

      srcBytes = bytes;
      srcName  = file.name;
      pages = doc.getPages().map((p, i) => ({
        src: i,
        origRot: ((p.getRotation().angle % 360) + 360) % 360,
        rot: 0,
        del: false,
      }));
      sel.clear(); anchor = null; cursor = null;

      revoke();
      srcUrl = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
      outDirty = true; mode = 'out';
      $('outName').value = srcName.replace(/\.pdf$/i, '') + '_edited.pdf';

      $('fname').textContent = srcName;
      $('editor').hidden = false;
      $('dropWrap').hidden = true;
      viewPage = 1;
      render();
      setMode('out');
      setNote('');
      setStatus(`${srcName} を読み込みました（${n}ページ）。`, 'ok');
    } catch (e) {
      setStatus('PDFとして読み込めません: ' + (e.message || e), 'err');
    }
  }

  function revoke() {
    if (outUrl && outUrl !== srcUrl) URL.revokeObjectURL(outUrl);
    outUrl = null;
    if (srcUrl) { URL.revokeObjectURL(srcUrl); srcUrl = null; }
    if (pdfDoc) { try { pdfDoc.destroy(); } catch {} pdfDoc = null; }
    pageCache.clear();
  }

  /* ---------- 並べ替え ---------- */
  // movers を、非選択ページのうち at 番目の位置に差し込む
  function placeAt(movers, rest, at) {
    pages = [...rest.slice(0, at), ...movers, ...rest.slice(at)];
    afterEdit();
  }

  // ドラッグ中のページを含む「動かす集合」を決める
  function moverSetFor(p) {
    return (sel.has(p) && sel.size > 1) ? pages.filter(q => sel.has(q)) : [p];
  }

  function dropOn(target, before) {
    const movers = moverSetFor(dragging);
    const mset = new Set(movers);
    if (mset.has(target)) return;                 // 自分自身の上に落とした
    const rest = pages.filter(q => !mset.has(q));
    const r = rest.indexOf(target);
    placeAt(movers, rest, before ? r : r + 1);
    setNote(`${movers.length}ページを移動しました。`, 'ok');
  }

  function nudge(dir) {
    const movers = pages.filter(p => sel.has(p));
    if (!movers.length) { setNote('ページが選択されていません。', 'err'); return; }
    const rest = pages.filter(p => !sel.has(p));
    if (!rest.length) { setNote('すべて選択されているため移動できません。', 'err'); return; }
    const first = pages.indexOf(movers[0]);
    const last  = pages.indexOf(movers[movers.length - 1]);
    let at;
    if (dir < 0) {
      let j = first - 1;
      while (j >= 0 && sel.has(pages[j])) j--;
      if (j < 0) { setNote('これ以上前には移動できません。', 'err'); return; }
      at = rest.indexOf(pages[j]);
    } else {
      let j = last + 1;
      while (j < pages.length && sel.has(pages[j])) j++;
      if (j >= pages.length) { setNote('これ以上後ろには移動できません。', 'err'); return; }
      at = rest.indexOf(pages[j]) + 1;
    }
    placeAt(movers, rest, at);
    setNote(movers.length > 1
      ? `${movers.length}ページをまとめて${dir < 0 ? '前' : '後ろ'}へ移動しました（離れた選択はここで連続になります）。`
      : `1ページを${dir < 0 ? '前' : '後ろ'}へ移動しました。`, 'ok');
  }

  const reordered = () => pages.some((p, i) => p.src !== i);

  /* ---------- 表示 ---------- */
  let dragging = null;

  function render() {
    const chips = $('chips');
    const no = outNumbers();
    chips.innerHTML = '';
    pages.forEach(p => {
      const b = document.createElement('button');
      b.type = 'button';
      b.draggable = true;
      b.className = 'chip' + (sel.has(p) ? ' sel' : '') + (p.del ? ' del' : '')
                  + (anchor === p ? ' anchor' : '');
      b.textContent = mode === 'src' ? String(p.src + 1) : (no.has(p) ? String(no.get(p)) : '−');
      b.setAttribute('aria-pressed', sel.has(p) ? 'true' : 'false');
      b.title = `元のPDF ${p.src + 1}ページ`
        + (p.del ? ' / 削除' : ` / 編集結果 ${no.get(p)}ページ目`)
        + (p.rot ? ` / ${p.rot}°回転` : '');
      if (p.rot) {
        const r = document.createElement('span');
        r.className = 'rot'; r.textContent = p.rot + '°';
        b.appendChild(r);
      }

      // 1回目＝起点 / 同じページをもう一度＝単独選択 / 別ページ＝範囲選択 / 選択済み＝解除
      b.addEventListener('click', () => {
        if (sel.has(p)) {
          sel.delete(p); anchor = null;
        } else if (anchor === null) {
          anchor = p;
        } else if (anchor === p) {
          sel.add(p); anchor = null;
        } else {
          const a = pages.indexOf(anchor), z = pages.indexOf(p);
          const [x, y] = a < z ? [a, z] : [z, a];
          for (let k = x; k <= y; k++) sel.add(pages[k]);
          anchor = null;
        }
        cursor = p;
        setNote('');
        render();
        jumpTo(p);
      });

      // ドラッグで並べ替え
      b.addEventListener('dragstart', e => {
        dragging = p;
        e.dataTransfer.setData('text/x-page', '1');
        e.dataTransfer.effectAllowed = 'move';
        b.classList.add('moving');
      });
      b.addEventListener('dragend', () => { dragging = null; render(); });
      b.addEventListener('dragover', e => {
        if (!dragging) return;
        e.preventDefault();
        const r = b.getBoundingClientRect();
        const before = e.clientX < r.left + r.width / 2;
        b.classList.toggle('over-left', before);
        b.classList.toggle('over-right', !before);
      });
      b.addEventListener('dragleave', () => b.classList.remove('over-left', 'over-right'));
      b.addEventListener('drop', e => {
        if (!dragging) return;
        e.preventDefault(); e.stopPropagation();
        const r = b.getBoundingClientRect();
        dropOn(p, e.clientX < r.left + r.width / 2);
      });

      chips.appendChild(b);
    });

    const nDel = pages.filter(p => p.del).length;
    const nRot = pages.filter(p => !p.del && p.rot).length;
    const nKeep = pages.length - nDel;
    $('count').textContent = pages.length ? `${pages.length}ページ → ${nKeep}ページ` : '';
    $('summary').innerHTML =
      `選択 <b>${sel.size}</b> ／ 削除 <b>${nDel}</b> ／ 回転 <b>${nRot}</b> ／ 並べ替え <b>${reordered() ? 'あり' : 'なし'}</b> ／ 出力 <b>${nKeep}</b> ページ`;
    $('modeOut').disabled = !nKeep;
    updateNav();
    updateOut();
  }

  function afterEdit() {
    outDirty = true;          // 「別タブで開く」用の全ページPDFは作り直しが必要
    render();
    showPage(viewPage);       // プレビューは1ページだけ作り直すので軽い
  }

  /* 操作の適用。skipDeleted=true の操作（回転）は削除済みページを対象から外す。 */
  function apply(fn, label, skipDeleted = false) {
    if (!sel.size) {
      setNote('ページが選択されていません。ページ番号をクリックして選んでください。', 'err');
      return;
    }
    const targets = [...sel].filter(p => !(skipDeleted && p.del));
    if (!targets.length) {
      setNote('選択されているのは削除済みのページだけです。先に「削除を取消」するか、別のページを選んでください。', 'err');
      return;
    }
    targets.forEach(fn);
    const skipped = sel.size - targets.length;
    sel.clear(); anchor = null;   // 直前の選択が次の操作に紛れ込むのを防ぐ
    afterEdit();
    setNote(`${targets.length}ページを${label}しました。`
      + (skipped ? `（削除済みの${skipped}ページは対象外）` : ''), 'ok');
  }

  /* ---------- プレビュー ----------
     ブラウザ内蔵のPDFビューア（iframe）は、URLの #page= を書き換えてもページが動かず、
     現在ページを問い合わせる手段も無いため、プレビューは pdf.js で canvas に自前描画する。
     PDFを開くのは1回だけ。ページ送りは canvas の差し替えだけなので再読込が起きない。
     前後のページを裏で描いてキャッシュしておくので、▲▼ は体感で即座に切り替わる。
     文書全体を通して見たいときは「別タブで開く」。 */
  const viewCount = () => (mode === 'src' ? pages.length : kept().length);

  let pdfDoc    = null;          // pdf.js のドキュメント（使い回す）
  let renderSeq = 0;             // 連打時に古い描画結果を捨てるための番号
  const pageCache = new Map();   // キー → 描画済み canvas
  const CACHE_MAX = 10;

  const setVMsg = msg => {
    const el = $('vmsg');
    if (!el) return;
    el.textContent = msg || '';
    el.hidden = !msg;
  };

  async function ensurePdfDoc() {
    if (pdfDoc) return pdfDoc;
    if (typeof pdfjsLib === 'undefined') throw new Error('lib/pdf.min.js を読み込めていません');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js';
    // pdf.js は渡したバッファを手放せなくなるので、必ず複製を渡す（srcBytes は書き出しでも使う）
    pdfDoc = await pdfjsLib.getDocument({ data: srcBytes.slice() }).promise;
    return pdfDoc;
  }

  // 描画に使える領域（padding 8px ぶんを引く）
  function stageSize() {
    const st = $('stage');
    return { w: Math.max(40, st.clientWidth - 18), h: Math.max(40, st.clientHeight - 18) };
  }

  // 「元のPDF」では編集の回転を当てない
  const extraRot = p => (mode === 'out' && p.rot ? p.rot : 0);

  function cacheKey(p) {
    const { w, h } = stageSize();
    return `${p.src}:${extraRot(p)}:${fitMode}:${Math.round(w)}x${Math.round(h)}`;
  }

  async function renderPage(p) {
    const doc = await ensurePdfDoc();
    const page = await doc.getPage(p.src + 1);
    const rotation = (page.rotate + extraRot(p)) % 360;
    const base = page.getViewport({ scale: 1, rotation });
    const { w, h } = stageSize();
    const scale = fitMode === 'Fit'
      ? Math.min(w / base.width, h / base.height)
      : w / base.width;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);   // 高解像度画面でもぼけないように
    const vp = page.getViewport({ scale: Math.max(0.05, scale) * dpr, rotation });
    const c = document.createElement('canvas');
    c.width  = Math.max(1, Math.round(vp.width));
    c.height = Math.max(1, Math.round(vp.height));
    c.style.width  = Math.round(vp.width / dpr) + 'px';
    c.style.height = Math.round(vp.height / dpr) + 'px';
    await page.render({ canvasContext: c.getContext('2d', { alpha: false }), viewport: vp }).promise;
    return c;
  }

  function cachePut(key, canvas) {
    pageCache.set(key, canvas);
    while (pageCache.size > CACHE_MAX) pageCache.delete(pageCache.keys().next().value);
  }

  function paint(canvas) {
    const st = $('stage');
    [...st.querySelectorAll('canvas')].forEach(c => c.remove());
    st.appendChild(canvas);
    st.scrollTop = 0;
    setVMsg('');
  }

  async function showPage(n) {
    const max = viewCount();
    viewPage = Math.min(Math.max(1, n | 0), Math.max(1, max));
    updateNav();
    if (!srcBytes || !max) return;
    const p = numberMap().get(viewPage);
    if (!p) return;

    const my = ++renderSeq;
    const key = cacheKey(p);
    const hit = pageCache.get(key);
    if (hit) { paint(hit); prefetch(); return; }

    $('stage').classList.add('busy');
    try {
      const c = await renderPage(p);
      cachePut(key, c);
      if (my !== renderSeq) return;     // もっと新しい要求が来ていた
      paint(c);
    } catch (e) {
      setVMsg('プレビューを描画できませんでした: ' + (e.message || e));
    } finally {
      if (my === renderSeq) $('stage').classList.remove('busy');
    }
    prefetch();
  }

  // 前後のページを裏で描いておく（描くだけで表示はしない）
  let prefetching = false;
  function prefetch() {
    if (prefetching) return;
    prefetching = true;
    setTimeout(async () => {
      try {
        const map = numberMap();
        for (const n of [viewPage + 1, viewPage - 1, viewPage + 2]) {
          const p = map.get(n);
          if (!p) continue;
          const key = cacheKey(p);
          if (pageCache.has(key)) continue;
          cachePut(key, await renderPage(p));
        }
      } catch {}
      prefetching = false;
    }, 60);
  }

  function updateNav() {
    const max = viewCount();
    $('vpage').textContent = max ? `${viewPage} / ${max}` : '− / −';
    $('pagePrev').disabled = !max || viewPage <= 1;
    $('pageNext').disabled = !max || viewPage >= max;
  }

  function stepPage(d) {
    const max = viewCount();
    if (!max) return;
    const n = Math.min(Math.max(1, viewPage + d), max);
    if (n === viewPage) return;
    cursor = numberMap().get(n) || cursor;   // 編集後も同じページに戻れるように覚えておく
    showPage(n);
    setVNote(`${n} ページ目を表示しています。` + baseVNote());
  }

  function jumpTo(p) {
    if (!p) { showPage(viewPage || 1); setVNote(baseVNote()); return; }
    if (mode === 'src') {
      showPage(p.src + 1);
      setVNote(`${p.src + 1} ページ目を表示しています。` + baseVNote());
      return;
    }
    const no = outNumbers();
    if (no.has(p)) {
      showPage(no.get(p));
      setVNote(`${no.get(p)} ページ目を表示しています。` + baseVNote());
      return;
    }
    let n = 0;
    for (const q of pages) { if (!q.del) n++; if (q === p) break; }
    n = Math.max(1, n);
    showPage(n);
    setVNote(`このページは削除するので編集結果にはありません（元のPDFでは ${p.src + 1} ページ目）。`
      + `手前の ${n} ページ目を表示しています。`);
  }

  function baseVNote() {
    return mode === 'src'
      ? '編集前の元PDFを1ページずつ表示しています。左のページ番号も元PDFの番号で、並べ替えの影響を受けません。'
      : '削除・回転・並べ替えを適用した結果を1ページずつ表示しています。左のページ番号は編集結果の番号と一致します（削除するページは − ）。全体を通して見るときや文字を選択したいときは「別タブで開く」。';
  }

  function setMode(m) {
    mode = m;
    $('modeSrc').classList.toggle('on', m === 'src');
    $('modeOut').classList.toggle('on', m === 'out');
    render();   // 表示する側に合わせて番号を振り直す
    jumpTo(cursor);
  }

  // 枠の大きさが変わったら描き直す（キャッシュのキーに寸法が入っているので自然に作り直される）
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (srcBytes) showPage(viewPage); }, 180);
  });

  /* ---------- 組み立て ---------- */
  async function buildFrom(list) {
    if (!list.length) throw new Error('ページがありません');
    const src = await PDFDocument.load(srcBytes, { ignoreEncryption: true });
    const out = await PDFDocument.create();
    const copied = await out.copyPages(src, list.map(p => p.src));
    copied.forEach((pg, k) => {
      const st = list[k];
      if (st.rot) pg.setRotation(degrees((st.origRot + st.rot) % 360));
      out.addPage(pg);
    });
    return await out.save();
  }

  const hasEdits = () => pages.some(p => p.del || p.rot) || reordered();

  // 「別タブで開く」用に、全ページをつないだPDFのURLを用意する（必要になったときだけ作る）
  async function ensureOutUrl() {
    if (!hasEdits()) {   // 変更がないうちは元PDFをそのまま使う
      if (outUrl && outUrl !== srcUrl) URL.revokeObjectURL(outUrl);
      outUrl = srcUrl; outDirty = false;
      return outUrl;
    }
    if (!outDirty && outUrl && outUrl !== srcUrl) return outUrl;
    setStatus('全ページを組み立て中…');
    try {
      const bytes = await buildFrom(kept());
      if (outUrl && outUrl !== srcUrl) URL.revokeObjectURL(outUrl);
      outUrl = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
      outDirty = false;
      setStatus('');
      return outUrl;
    } catch (e) {
      setStatus('組み立てに失敗しました: ' + (e.message || e), 'err');
      return null;
    }
  }

  /* ---------- 書き出しの単位 ---------- */
  // 出力を「ファイルごとのページ配列」に切り分ける
  function chunks() {
    const k = kept();
    const m = $('outMode').value;
    if (m === 'sel') {
      const s = k.filter(p => sel.has(p));
      return { list: s.length ? [s] : [], err: s.length ? '' : '選択されている（削除されていない）ページがありません。' };
    }
    if (m === 'every') {
      const n = parseInt($('splitArg').value, 10);
      if (!Number.isFinite(n) || n < 1) return { list: [], err: '1以上の数を入力してください。' };
      const out = [];
      for (let i = 0; i < k.length; i += n) out.push(k.slice(i, i + n));
      return { list: out, err: '' };
    }
    if (m === 'at') {
      const { nums, bad } = parseNums($('splitArg').value, k.length);
      if (bad.length) return { list: [], err: `解釈できない指定: ${bad.join(', ')}（1〜${k.length}）` };
      const cuts = nums.filter(n => n > 1);
      if (!cuts.length) return { list: [], err: '区切り位置を指定してください（例: 10, 25, 60）。' };
      const out = []; let start = 0;
      for (const c of cuts) { out.push(k.slice(start, c - 1)); start = c - 1; }
      out.push(k.slice(start));
      return { list: out.filter(c => c.length), err: '' };
    }
    return { list: k.length ? [k] : [], err: k.length ? '' : '残るページがありません。' };
  }

  function updateOut() {
    const m = $('outMode').value;
    const split = (m === 'every' || m === 'at');
    $('splitArg').hidden = !split;
    $('splitArg').placeholder = m === 'every' ? '例: 10（ページごと）' : '例: 10, 25, 60（この番号の前で区切る）';
    $('outNameLabel').textContent = split ? '保存名の先頭' : '保存名';

    const { list, err } = chunks();
    const info = $('splitinfo');
    if (err) { info.className = 'splitinfo err'; info.textContent = err; }
    else if (list.length > 1) {
      const no = outNumbers();
      const ranges = list.map(c => {
        const a = no.get(c[0]), b = no.get(c[c.length - 1]);
        return a === b ? `${a}` : `${a}–${b}`;
      });
      info.className = 'splitinfo';
      info.textContent = `${list.length}ファイルに分かれます（${ranges.slice(0, 8).join(' / ')}${ranges.length > 8 ? ' / …' : ''}）。保存先フォルダを選びます。`;
    } else if (list.length === 1) {
      info.className = 'splitinfo';
      info.textContent = `${list[0].length}ページを1ファイルとして書き出します。`;
    } else { info.className = 'splitinfo'; info.textContent = ''; }
    $('save').disabled = !list.length;
  }

  /* ---------- 保存 ---------- */
  function outBase() {
    let name = $('outName').value.trim() || 'edited.pdf';
    return name.replace(/\.pdf$/i, '');
  }

  async function save() {
    const { list, err } = chunks();
    if (err || !list.length) { setStatus(err || '書き出すページがありません。', 'err'); return; }
    $('save').disabled = true;
    try {
      // ブラウザは「クリック直後」でないと保存ダイアログを開けないため、保存先を先に決める
      if (list.length > 1) { await saveMany(list); return; }

      const name = outBase() + '.pdf';
      let handle = null;
      if (window.showSaveFilePicker) {
        try {
          handle = await showSaveFilePicker({
            suggestedName: name,
            types: [{ description: 'PDF', accept: { 'application/pdf': ['.pdf'] } }],
          });
        } catch (e) {
          if (e.name === 'AbortError') { setStatus('保存をキャンセルしました。'); return; }
          handle = null;
        }
      }
      setStatus('書き出し中…');
      const blob = new Blob([await buildFrom(list[0])], { type: 'application/pdf' });
      if (handle) {
        const w = await handle.createWritable();
        await w.write(blob); await w.close();
        setStatus(`${handle.name} を保存しました（${list[0].length}ページ）。`, 'ok');
        return;
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      setStatus(`${name} をダウンロードしました（${list[0].length}ページ）。`, 'ok');
    } catch (e) {
      setStatus('保存に失敗しました: ' + (e.message || e), 'err');
    } finally {
      updateOut();
    }
  }

  // 分割保存：フォルダを1回選んで、その中に連番で書き出す
  async function saveMany(list) {
    if (!window.showDirectoryPicker) {
      setStatus('このブラウザはフォルダ保存に対応していないため、分割保存は使えません。'
        + '「指定位置で分割」の代わりに「選択ページだけを1ファイル」で1本ずつ保存してください。', 'err');
      return;
    }
    let dir;
    try {
      dir = await showDirectoryPicker({ mode: 'readwrite' });
    } catch (e) {
      if (e.name === 'AbortError') { setStatus('保存をキャンセルしました。'); return; }
      throw e;
    }
    const base = outBase();
    const width = String(list.length).length;
    for (let i = 0; i < list.length; i++) {
      setStatus(`書き出し中… ${i + 1} / ${list.length}`);
      const bytes = await buildFrom(list[i]);
      const fname = `${base}_${String(i + 1).padStart(Math.max(2, width), '0')}.pdf`;
      const fh = await dir.getFileHandle(fname, { create: true });
      const w = await fh.createWritable();
      await w.write(new Blob([bytes], { type: 'application/pdf' }));
      await w.close();
    }
    setStatus(`${list.length}ファイルを ${base}_… の名前で保存しました。`, 'ok');
  }

  /* ---------- 入力 ---------- */
  let depth = 0;
  const isFileDrag = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
  window.addEventListener('dragenter', e => { if (isFileDrag(e)) { depth++; document.body.classList.add('dragging'); } });
  window.addEventListener('dragleave', e => { if (isFileDrag(e) && --depth <= 0) { depth = 0; document.body.classList.remove('dragging'); } });
  window.addEventListener('dragover', e => { if (isFileDrag(e)) e.preventDefault(); });
  window.addEventListener('drop', e => {
    if (!isFileDrag(e)) return;
    e.preventDefault(); depth = 0; document.body.classList.remove('dragging');
    const fs = [...e.dataTransfer.files];
    if (fs.length > 1) setStatus('1ファイルずつ編集します。最初のPDFを読み込みました。');
    loadFile(fs[0]);
  });

  $('drop').addEventListener('click', () => $('picker').click());
  $('drop').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('picker').click(); } });
  $('picker').addEventListener('change', e => { loadFile(e.target.files[0]); e.target.value = ''; });
  $('reload').addEventListener('click', () => { $('picker').click(); });

  $('rangeSel').addEventListener('click', () => {
    const { set, bad, max } = parseRanges($('rangeInput').value);
    if (!set.size && !bad.length) { setNote('ページ番号を入力してください。', 'err'); return; }
    sel = set;
    anchor = null;
    cursor = pages.find(p => sel.has(p)) || null;
    render();
    if (cursor) jumpTo(cursor);
    setNote(bad.length
      ? `解釈できない指定: ${bad.join(', ')}（1〜${max}の範囲で指定してください）`
      : `${set.size}ページを選択しました。`, bad.length ? 'err' : '');
  });
  $('rangeInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('rangeSel').click(); });
  $('selAll').addEventListener('click', () => { sel = new Set(pages); anchor = null; setNote(''); render(); });
  $('selNone').addEventListener('click', () => { sel.clear(); anchor = null; setNote(''); render(); });

  $('opDel').addEventListener('click', () => apply(p => { p.del = true; }, '削除'));
  $('opUndel').addEventListener('click', () => apply(p => { p.del = false; }, '削除取消'));
  $('rot90').addEventListener('click', () => apply(p => { p.rot = (p.rot + 90) % 360; }, '90°回転', true));
  $('rot180').addEventListener('click', () => apply(p => { p.rot = (p.rot + 180) % 360; }, '180°回転', true));
  $('rot270').addEventListener('click', () => apply(p => { p.rot = (p.rot + 270) % 360; }, '270°回転', true));
  $('rot0').addEventListener('click', () => apply(p => { p.rot = 0; }, '回転リセット', true));
  $('moveUp').addEventListener('click', () => nudge(-1));
  $('moveDown').addEventListener('click', () => nudge(1));
  $('resetAll').addEventListener('click', () => {
    pages.sort((a, b) => a.src - b.src);
    pages.forEach(p => { p.del = false; p.rot = 0; });
    sel.clear(); anchor = null;
    afterEdit();
    setNote('削除・回転・並べ替えをすべて取り消しました。');
  });

  $('pagePrev').addEventListener('click', () => stepPage(-1));
  $('pageNext').addEventListener('click', () => stepPage(1));
  $('fitMode').addEventListener('change', e => { fitMode = e.target.value; showPage(viewPage); });
  $('modeSrc').addEventListener('click', () => setMode('src'));
  $('modeOut').addEventListener('click', () => setMode('out'));
  $('openTab').addEventListener('click', async () => {
    const url = mode === 'src' ? srcUrl : await ensureOutUrl();
    if (url) window.open(`${url}#page=${viewPage}&view=${fitMode}`, '_blank');
  });
  $('outMode').addEventListener('change', updateOut);
  $('splitArg').addEventListener('input', updateOut);
  $('save').addEventListener('click', save);

  document.addEventListener('keydown', e => {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
    if ((e.key === 'Delete' || e.key === 'Backspace') && sel.size) { e.preventDefault(); $('opDel').click(); }
    else if (e.key === 'PageUp') { e.preventDefault(); stepPage(-1); }
    else if (e.key === 'PageDown') { e.preventDefault(); stepPage(1); }
  });
})();
</script>
</body>
</html>
