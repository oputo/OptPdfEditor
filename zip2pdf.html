<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zip→PDF変換</title>
<style>
  :root{
    --bg:#E6E9EC; --sheet:#FFFFFF; --ink:#1E2830; --muted:#66727C;
    --line:#C9CFD5; --accent:#2457C5; --warn:#B3261E; --good:#1F6E3A;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"BIZ UDPGothic","Yu Gothic UI","Meiryo",system-ui,sans-serif;
    font-size:15px;line-height:1.55;
  }
  .wrap{max-width:860px;margin:0 auto;padding:28px 20px 40px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}
  h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.02em}
  nav a{color:var(--accent);font-size:13px;text-decoration:none}
  nav a:hover{text-decoration:underline}

  .drop{
    position:relative;background:var(--sheet);border:1.5px dashed var(--line);
    border-radius:6px;padding:26px 20px;text-align:center;cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .drop::before,.drop::after{
    content:"";position:absolute;inset:0;border-radius:6px;background:var(--sheet);
    border:1px solid var(--line);z-index:-1;
  }
  .drop::before{transform:translate(5px,5px)}
  .drop::after{transform:translate(10px,10px);opacity:.6}
  .drop:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  body.dragging .drop{border-color:var(--accent);background:#F1F5FD}
  .drop strong{font-size:17px;display:block}
  .drop span{color:var(--muted);font-size:13px}
  .drop-wrap{position:relative;z-index:0;margin-bottom:28px}

  /* 共通タブ */
  .tabs{display:flex;gap:2px;margin:0 0 22px;border-bottom:1px solid var(--line)}
  .tabs a{
    font-size:13px;text-decoration:none;color:var(--muted);padding:7px 14px;
    border:1px solid transparent;border-bottom:none;border-radius:4px 4px 0 0;
    position:relative;top:1px;
  }
  .tabs a:hover{color:var(--ink);background:#EDF0F3}
  .tabs a.is-current{
    background:var(--sheet);border-color:var(--line);border-bottom-color:var(--sheet);
    color:var(--ink);font-weight:700;
  }

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px;align-items:center}
  .toolbar .count{margin-left:auto;color:var(--muted);font-size:13px}
  ol.list{list-style:none;margin:0;padding:0;background:var(--sheet);border:1px solid var(--line);border-radius:6px}
  .empty{padding:22px;text-align:center;color:var(--muted)}
  li.item{
    display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;
    padding:10px 10px 10px 14px;border-top:1px solid var(--line);
  }
  li.item:first-child{border-top:none}
  .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
  .detail{grid-column:1;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
  .detail.err{color:var(--warn)}
  .state{grid-column:2;grid-row:1 / span 2;display:flex;gap:8px;align-items:center;font-size:13px;white-space:nowrap}
  .state .done{color:var(--good)}
  .state .fail{color:var(--warn)}
  details.skip{grid-column:1 / span 2;font-size:13px;color:var(--muted)}
  details.skip summary{cursor:pointer}
  details.skip ul{margin:4px 0 0;padding-left:20px}

  button{
    font:inherit;font-size:13px;color:var(--ink);background:var(--sheet);
    border:1px solid var(--line);border-radius:4px;padding:5px 10px;cursor:pointer;
  }
  button:hover:not(:disabled){border-color:var(--ink)}
  button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
  button:disabled{opacity:.4;cursor:default}

  .out{margin-top:22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .out p{margin:0;font-size:13px;color:var(--muted);flex:1;min-width:240px}
  button.primary{
    background:var(--accent);border-color:var(--accent);color:#fff;font-size:15px;
    padding:9px 22px;font-weight:700;
  }
  button.primary:hover:not(:disabled){background:#1C47A6;border-color:#1C47A6}
  .status{margin-top:12px;min-height:1.5em;font-size:13px;color:var(--muted)}
  .status.err{color:var(--warn)}
  .status.ok{color:var(--good)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>zip→PDF変換</h1>
  </header>

  <nav class="tabs">
    <a href="index.html">ホーム</a>
    <a href="pdf-merge.html">PDF結合</a>
    <a href="pdf-edit.html">ページ編集</a>
    <a href="zip2pdf.html" class="is-current" aria-current="page">zip→PDF変換</a>
  </nav>

  <div class="drop-wrap">
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="zipを追加">
      <strong>zipをここにドロップ</strong>
      <span>画像（jpg / png / webp）とテキスト（txt / md / csv / log）を、ファイル名順に1つのPDFにします。</span>
    </div>
    <input type="file" id="picker" accept=".zip,application/zip" multiple hidden>
  </div>

  <div class="toolbar">
    <button id="clearAll">すべて外す</button>
    <span class="count" id="count"></span>
  </div>

  <ol class="list" id="list"></ol>

  <div class="out">
    <p id="saveHint"></p>
    <button class="primary" id="convert">PDFに変換して保存</button>
  </div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
</div>

<script src="lib/pdf-lib.min.js"></script>
<script src="lib/jszip.min.js"></script>
<script src="lib/fontkit.umd.min.js"></script>
<script src="lib/opt-topdf.js"></script>
<script>
(() => {
  const { PDFDocument } = PDFLib;
  const { IMG_EXT, TXT_EXT, decodeBytes, addImagePage, embedTextFont, addTextPages } = OptToPdf;
  const $ = id => document.getElementById(id);

  const collator = new Intl.Collator('ja', { numeric: true, sensitivity: 'base' });
  let queue = [];   // {id, file, name, entries, images, texts, skipped[], state, message}
  let seq = 0;

  const setStatus = (msg, kind = '') => { $('status').textContent = msg; $('status').className = 'status' + (kind ? ' ' + kind : ''); };
  const fmtSize = n => n < 1024*1024 ? (n/1024).toFixed(0) + ' KB' : (n/1024/1024).toFixed(2) + ' MB';

  // ---- zip 読み込み（ファイル名の Shift_JIS 対策込み）----
  async function inspectZip(item) {
    const zip = await JSZip.loadAsync(item.file, {
      decodeFileName: bytes => decodeBytes(bytes instanceof Uint8Array ? bytes : Uint8Array.from(bytes)),
    });
    const entries = [];
    zip.forEach((path, entry) => {
      if (entry.dir) return;
      const base = path.split('/').pop();
      if (path.startsWith('__MACOSX/') || base.startsWith('.') || /^thumbs\.db$/i.test(base)) return;
      entries.push({ path, entry });
    });
    entries.sort((a, b) => collator.compare(a.path, b.path));
    item.entries = entries.filter(e => IMG_EXT.test(e.path) || TXT_EXT.test(e.path));
    item.images = item.entries.filter(e => IMG_EXT.test(e.path)).length;
    item.texts = item.entries.length - item.images;
    item.skipped = entries.filter(e => !IMG_EXT.test(e.path) && !TXT_EXT.test(e.path)).map(e => e.path);
    if (!item.entries.length) { item.state = 'error'; item.message = '変換できるファイル（jpg / png / txt など）がありません'; }
  }

  async function convert(item) {
    const pdf = await PDFDocument.create();
    pdf.setTitle(item.name.replace(/\.zip$/i, ''));
    const failed = [];
    // 先に全ファイルを読み、テキストで使う文字を集める
    const loadedEntries = [];
    for (const { path, entry } of item.entries) {
      try {
        const bytes = await entry.async('uint8array');
        loadedEntries.push(IMG_EXT.test(path) ? { path, bytes } : { path, text: decodeBytes(bytes) });
      } catch { failed.push(path); }
    }
    let font = null;
    const allText = loadedEntries.filter(e => e.text !== undefined).map(e => e.text).join('');
    if (loadedEntries.some(e => e.text !== undefined)) font = await embedTextFont(pdf, allText);
    for (const e of loadedEntries) {
      try {
        if (e.bytes) await addImagePage(pdf, e.bytes, e.path);
        else addTextPages(pdf, font, e.text);
      } catch { failed.push(e.path); }
    }
    if (!pdf.getPageCount()) throw new Error('ページを作れませんでした');
    return { bytes: await pdf.save(), pages: pdf.getPageCount(), failed };
  }

  // ---- 保存 ----
  // ブラウザは「クリック直後」でないとファイル選択ダイアログを開けないため、
  // 保存先を先に決めてから変換する
  const pdfName = item => item.name.replace(/\.zip$/i, '') + '.pdf';
  const PDF_TYPES = [{ description: 'PDF', accept: { 'application/pdf': ['.pdf'] } }];

  async function pickDestination(targets) {
    if (targets.length === 1 && window.showSaveFilePicker) {
      return { kind: 'file', handle: await showSaveFilePicker({ suggestedName: pdfName(targets[0]), types: PDF_TYPES }) };
    }
    if (targets.length > 1 && window.showDirectoryPicker) {
      const dir = await showDirectoryPicker({ mode: 'readwrite' });
      const exists = [];
      for (const item of targets) {
        try { await dir.getFileHandle(pdfName(item)); exists.push(pdfName(item)); } catch {}
      }
      if (exists.length && !confirm(`次のファイルは同名のPDFがあるため上書きします。\n\n${exists.join('\n')}`)) {
        throw new DOMException('cancel', 'AbortError');
      }
      return { kind: 'dir', dir };
    }
    return { kind: 'download' };
  }

  async function writeResult(dest, r) {
    const blob = new Blob([r.bytes], { type: 'application/pdf' });
    if (dest.kind === 'file' || dest.kind === 'dir') {
      const h = dest.kind === 'file' ? dest.handle : await dest.dir.getFileHandle(pdfName(r.item), { create: true });
      const w = await h.createWritable(); await w.write(blob); await w.close();
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = pdfName(r.item); document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    await new Promise(res => setTimeout(res, 300));
  }

  async function run() {
    const targets = queue.filter(i => i.state === 'ready' || i.state === 'done' || i.state === 'fail');
    if (!targets.length) return;
    $('convert').disabled = true;

    let dest;
    try {
      dest = await pickDestination(targets);
    } catch (e) {
      if (e.name === 'AbortError') setStatus('保存をキャンセルしました。');
      else setStatus('保存先を選べませんでした: ' + (e.message || e), 'err');
      render();
      return;
    }

    let saved = 0;
    for (const [n, item] of targets.entries()) {
      item.state = 'working'; item.message = ''; render();
      setStatus(`変換中… ${n + 1} / ${targets.length}`);
      try {
        const r = await convert(item);
        item.pages = r.pages; item.failed = r.failed;
        item.message = r.failed.length ? `読み込めなかった${r.failed.length}件を除外` : '';
        await writeResult(dest, { item, ...r });
        item.state = 'done'; saved++;
      } catch (e) {
        item.state = 'fail'; item.message = e.message || String(e);
      }
      render();
    }

    const failedCount = targets.length - saved;
    if (!saved) {
      // 保存ダイアログで作られた空ファイルを片付ける（対応ブラウザのみ）
      if (dest.kind === 'file' && dest.handle.remove) { try { await dest.handle.remove(); } catch {} }
      setStatus('変換できたzipがありません。', 'err');
    } else {
      const where = dest.kind === 'file' ? `${dest.handle.name} を保存しました。`
        : dest.kind === 'dir' ? `${saved}件のPDFを「${dest.dir.name}」に保存しました。`
        : `${saved}件のPDFをダウンロードしました。`;
      setStatus(where + (failedCount ? ` ${failedCount}件は失敗しました。` : ''), failedCount ? 'err' : 'ok');
    }
    render();
  }

  // ---- 一覧 ----
  async function addFiles(fileList) {
    const files = [...fileList].filter(f => /\.zip$/i.test(f.name));
    const ignored = fileList.length - files.length;
    if (!files.length) { setStatus('zipファイルが含まれていません。', 'err'); return; }
    setStatus('zipを確認中…');
    let dup = 0;
    for (const file of files.sort((a, b) => collator.compare(a.name, b.name))) {
      if (queue.some(i => i.name === file.name && i.file.size === file.size)) { dup++; continue; }
      const item = { id: ++seq, file, name: file.name, entries: [], images: 0, texts: 0, skipped: [], state: 'ready', message: '' };
      queue.push(item);
      try { await inspectZip(item); }
      catch { item.state = 'error'; item.message = 'zipとして読み込めません（パスワード付きの可能性があります）'; }
      render();
    }
    const notes = [`${files.length - dup}件を追加しました。`];
    if (dup) notes.push(`同じzip${dup}件は追加していません。`);
    if (ignored) notes.push(`zip以外の${ignored}件は無視しました。`);
    setStatus(notes.join(' '));
  }

  function render() {
    const list = $('list'); list.innerHTML = '';
    if (!queue.length) {
      const li = document.createElement('li'); li.className = 'empty';
      li.textContent = 'まだzipがありません。上の枠にドロップしてください。';
      list.appendChild(li);
    }
    for (const item of queue) {
      const li = document.createElement('li'); li.className = 'item';
      const name = document.createElement('div'); name.className = 'name'; name.textContent = item.name; name.title = item.name;
      const detail = document.createElement('div');
      if (item.state === 'error') { detail.className = 'detail err'; detail.textContent = item.message; }
      else {
        detail.className = 'detail';
        const parts = [fmtSize(item.file.size), `画像${item.images}`, `テキスト${item.texts}`];
        if (item.skipped.length) parts.push(`対象外${item.skipped.length}`);
        if (item.pages) parts.push(`→ ${item.pages}ページ`);
        if (item.message) parts.push(item.message);
        detail.textContent = parts.join('　');
        if (item.state === 'fail') detail.classList.add('err');
      }
      const state = document.createElement('div'); state.className = 'state';
      const label = { ready: '', working: '変換中…', converted: '保存待ち', done: '保存済み', fail: '失敗', error: '' }[item.state];
      if (label) { const s = document.createElement('span'); s.textContent = label; if (item.state === 'done') s.className = 'done'; if (item.state === 'fail') s.className = 'fail'; state.appendChild(s); }
      const rm = document.createElement('button'); rm.textContent = '×'; rm.setAttribute('aria-label', `${item.name} を外す`);
      rm.disabled = item.state === 'working';
      rm.addEventListener('click', () => { queue = queue.filter(q => q !== item); render(); });
      state.appendChild(rm);
      li.append(name, state, detail);

      const extra = [...item.skipped.map(p => `対象外: ${p}`), ...(item.failed || []).map(p => `読み込み失敗: ${p}`)];
      if (extra.length) {
        const d = document.createElement('details'); d.className = 'skip';
        const s = document.createElement('summary'); s.textContent = '含めなかったファイル';
        const ul = document.createElement('ul');
        extra.forEach(t => { const x = document.createElement('li'); x.textContent = t; ul.appendChild(x); });
        d.append(s, ul); li.appendChild(d);
      }
      list.appendChild(li);
    }
    const ok = queue.filter(i => i.state !== 'error');
    $('count').textContent = queue.length ? `${queue.length}件` : '';
    $('convert').disabled = !ok.length || queue.some(i => i.state === 'working');
    $('clearAll').disabled = !queue.length;
    $('saveHint').textContent = ok.length > 1
      ? (window.showDirectoryPicker ? '保存先フォルダを選ぶと、zipと同じ名前のPDFをまとめて保存します。' : 'zipと同じ名前のPDFを1件ずつダウンロードします。')
      : 'zipと同じ名前のPDFで保存します。';
  }

  let depth = 0;
  const isFileDrag = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
  window.addEventListener('dragenter', e => { if (isFileDrag(e)) { depth++; document.body.classList.add('dragging'); } });
  window.addEventListener('dragleave', e => { if (isFileDrag(e) && --depth <= 0) { depth = 0; document.body.classList.remove('dragging'); } });
  window.addEventListener('dragover', e => { if (isFileDrag(e)) e.preventDefault(); });
  window.addEventListener('drop', e => { if (!isFileDrag(e)) return; e.preventDefault(); depth = 0; document.body.classList.remove('dragging'); addFiles(e.dataTransfer.files); });

  $('drop').addEventListener('click', () => $('picker').click());
  $('drop').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('picker').click(); } });
  $('picker').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
  $('clearAll').addEventListener('click', () => { queue = []; render(); setStatus(''); });
  $('convert').addEventListener('click', run);
  render();
})();
</script>
</body>
</html>
