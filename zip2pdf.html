<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zip→PDF変換</title>
<style>
  :root{
    --bg:#E6E9EC; --sheet:#FFFFFF; --ink:#1E2830; --muted:#66727C;
    --line:#C9CFD5; --accent:#2457C5; --warn:#B3261E; --good:#1F6E3A;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"BIZ UDPGothic","Yu Gothic UI","Meiryo",system-ui,sans-serif;
    font-size:15px;line-height:1.55;
  }
  .wrap{max-width:860px;margin:0 auto;padding:28px 20px 40px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}
  h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.02em}
  nav a{color:var(--accent);font-size:13px;text-decoration:none}
  nav a:hover{text-decoration:underline}

  .drop{
    position:relative;background:var(--sheet);border:1.5px dashed var(--line);
    border-radius:6px;padding:26px 20px;text-align:center;cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .drop::before,.drop::after{
    content:"";position:absolute;inset:0;border-radius:6px;background:var(--sheet);
    border:1px solid var(--line);z-index:-1;
  }
  .drop::before{transform:translate(5px,5px)}
  .drop::after{transform:translate(10px,10px);opacity:.6}
  .drop:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  body.dragging .drop{border-color:var(--accent);background:#F1F5FD}
  .drop strong{font-size:17px;display:block}
  .drop span{color:var(--muted);font-size:13px}
  .drop-wrap{position:relative;z-index:0;margin-bottom:28px}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px;align-items:center}
  .toolbar .count{margin-left:auto;color:var(--muted);font-size:13px}
  ol.list{list-style:none;margin:0;padding:0;background:var(--sheet);border:1px solid var(--line);border-radius:6px}
  .empty{padding:22px;text-align:center;color:var(--muted)}
  li.item{
    display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;
    padding:10px 10px 10px 14px;border-top:1px solid var(--line);
  }
  li.item:first-child{border-top:none}
  .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
  .detail{grid-column:1;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
  .detail.err{color:var(--warn)}
  .state{grid-column:2;grid-row:1 / span 2;display:flex;gap:8px;align-items:center;font-size:13px;white-space:nowrap}
  .state .done{color:var(--good)}
  .state .fail{color:var(--warn)}
  details.skip{grid-column:1 / span 2;font-size:13px;color:var(--muted)}
  details.skip summary{cursor:pointer}
  details.skip ul{margin:4px 0 0;padding-left:20px}

  button{
    font:inherit;font-size:13px;color:var(--ink);background:var(--sheet);
    border:1px solid var(--line);border-radius:4px;padding:5px 10px;cursor:pointer;
  }
  button:hover:not(:disabled){border-color:var(--ink)}
  button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
  button:disabled{opacity:.4;cursor:default}

  .out{margin-top:22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .out p{margin:0;font-size:13px;color:var(--muted);flex:1;min-width:240px}
  button.primary{
    background:var(--accent);border-color:var(--accent);color:#fff;font-size:15px;
    padding:9px 22px;font-weight:700;
  }
  button.primary:hover:not(:disabled){background:#1C47A6;border-color:#1C47A6}
  .status{margin-top:12px;min-height:1.5em;font-size:13px;color:var(--muted)}
  .status.err{color:var(--warn)}
  .status.ok{color:var(--good)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>zip→PDF変換</h1>
    <nav><a href="index.html">PDF結合へ</a></nav>
  </header>

  <div class="drop-wrap">
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="zipを追加">
      <strong>zipをここにドロップ</strong>
      <span>画像（jpg / png / webp）とテキスト（txt / md / csv / log）を、ファイル名順に1つのPDFにします。</span>
    </div>
    <input type="file" id="picker" accept=".zip,application/zip" multiple hidden>
  </div>

  <div class="toolbar">
    <button id="clearAll">すべて外す</button>
    <span class="count" id="count"></span>
  </div>

  <ol class="list" id="list"></ol>

  <div class="out">
    <p id="saveHint"></p>
    <button class="primary" id="convert">PDFに変換して保存</button>
  </div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
</div>

<script src="lib/pdf-lib.min.js"></script>
<script src="lib/jszip.min.js"></script>
<script src="lib/fontkit.umd.min.js"></script>
<script>
(() => {
  const { PDFDocument, degrees, PDFHexString, pushGraphicsState, popGraphicsState, concatTransformationMatrix, drawObject } = PDFLib;
  const $ = id => document.getElementById(id);

  const IMG_EXT = /\.(jpe?g|png|webp)$/i;
  const TXT_EXT = /\.(txt|md|csv|log)$/i;
  const PX_TO_PT = 0.75;          // 96dpi 換算（1px = 0.75pt）
  const MAX_PT = 14400;           // PDFのページ寸法上限
  const TEXT = { pageW: 595.28, pageH: 841.89, margin: 48, size: 10.5, lead: 1.6, tab: 4 };

  const collator = new Intl.Collator('ja', { numeric: true, sensitivity: 'base' });
  let queue = [];   // {id, file, name, entries, images, texts, skipped[], state, message}
  let seq = 0;

  const setStatus = (msg, kind = '') => { $('status').textContent = msg; $('status').className = 'status' + (kind ? ' ' + kind : ''); };
  const fmtSize = n => n < 1024*1024 ? (n/1024).toFixed(0) + ' KB' : (n/1024/1024).toFixed(2) + ' MB';

  // ---- 文字コード判定（UTF-8 → だめなら Shift_JIS）----
  function decodeBytes(bytes) {
    let b = bytes;
    if (b[0] === 0xEF && b[1] === 0xBB && b[2] === 0xBF) b = b.subarray(3);
    else if (b[0] === 0xFF && b[1] === 0xFE) return new TextDecoder('utf-16le').decode(b.subarray(2));
    else if (b[0] === 0xFE && b[1] === 0xFF) return new TextDecoder('utf-16be').decode(b.subarray(2));
    try { return new TextDecoder('utf-8', { fatal: true }).decode(b); }
    catch { return new TextDecoder('shift_jis').decode(b); }
  }

  // ---- zip 読み込み（ファイル名の Shift_JIS 対策込み）----
  async function inspectZip(item) {
    const zip = await JSZip.loadAsync(item.file, {
      decodeFileName: bytes => decodeBytes(bytes instanceof Uint8Array ? bytes : Uint8Array.from(bytes)),
    });
    const entries = [];
    zip.forEach((path, entry) => {
      if (entry.dir) return;
      const base = path.split('/').pop();
      if (path.startsWith('__MACOSX/') || base.startsWith('.') || /^thumbs\.db$/i.test(base)) return;
      entries.push({ path, entry });
    });
    entries.sort((a, b) => collator.compare(a.path, b.path));
    item.entries = entries.filter(e => IMG_EXT.test(e.path) || TXT_EXT.test(e.path));
    item.images = item.entries.filter(e => IMG_EXT.test(e.path)).length;
    item.texts = item.entries.length - item.images;
    item.skipped = entries.filter(e => !IMG_EXT.test(e.path) && !TXT_EXT.test(e.path)).map(e => e.path);
    if (!item.entries.length) { item.state = 'error'; item.message = '変換できるファイル（jpg / png / txt など）がありません'; }
  }

  // ---- JPEG の EXIF 向き ----
  function jpegOrientation(bytes) {
    const v = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    if (v.getUint16(0) !== 0xFFD8) return 1;
    let off = 2;
    while (off + 4 < v.byteLength) {
      const marker = v.getUint16(off); const len = v.getUint16(off + 2);
      if (marker === 0xFFE1 && v.getUint32(off + 4) === 0x45786966) {
        const t = off + 10; const le = v.getUint16(t) === 0x4949;
        const ifd = t + v.getUint32(t + 4, le); const n = v.getUint16(ifd, le);
        for (let i = 0; i < n; i++) {
          const e = ifd + 2 + i * 12;
          if (v.getUint16(e, le) === 0x0112) return v.getUint16(e + 8, le);
        }
        return 1;
      }
      if ((marker & 0xFF00) !== 0xFF00 || marker === 0xFFDA) break;
      off += 2 + len;
    }
    return 1;
  }

  // canvas 経由で向きを反映して再エンコード（反転を含む向き・読めない PNG 用）
  async function normalizeViaCanvas(bytes, mime, forceMime) {
    const bmp = await createImageBitmap(new Blob([bytes], { type: mime }), { imageOrientation: 'from-image' });
    const c = document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height;
    c.getContext('2d').drawImage(bmp, 0, 0);
    const outMime = forceMime || (mime === 'image/png' ? 'image/png' : 'image/jpeg');
    const blob = await new Promise(r => c.toBlob(r, outMime, 0.95));
    return { bytes: new Uint8Array(await blob.arrayBuffer()), mime: outMime };
  }

  // WebP の種類を判定（可逆圧縮か・透過ありか）
  function webpInfo(b) {
    const tag = off => String.fromCharCode(b[off], b[off + 1], b[off + 2], b[off + 3]);
    const info = { lossless: false, alpha: false };
    if (b.length < 30 || tag(0) !== 'RIFF' || tag(8) !== 'WEBP') return info;
    let off = 12;
    while (off + 8 <= b.length) {
      const t = tag(off), size = b[off + 4] | (b[off + 5] << 8) | (b[off + 6] << 16) | (b[off + 7] << 24);
      if (t === 'VP8X') info.alpha = !!(b[off + 8] & 0x10);
      if (t === 'VP8L') { info.lossless = true; if (b[off + 12] & 0x10) info.alpha = true; }
      if (t === 'ALPH') info.alpha = true;
      off += 8 + size + (size & 1);
    }
    return info;
  }

  function fitPage(wPx, hPx) {
    let w = wPx * PX_TO_PT, h = hPx * PX_TO_PT;
    const k = Math.min(1, MAX_PT / Math.max(w, h));
    return { w: w * k, h: h * k };
  }

  // ---- PNG をなるべく元の圧縮のまま埋め込む ----
  // pdf-lib の embedPng は PNG を展開して予測フィルタなしで再圧縮するため、元より大きくなる。
  // 透過なし PNG は圧縮データ（IDAT）をそのまま、透過あり PNG は色と透過を分けて
  // PNG と同じ予測フィルタ付きで再圧縮して埋め込む。
  function parsePng(b) {
    const sig = [137, 80, 78, 71, 13, 10, 26, 10];
    if (b.length < 33 || sig.some((v, i) => b[i] !== v)) return null;
    const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
    let off = 8, ihdr = null, plte = null, trns = false, total = 0;
    const idat = [];
    while (off + 8 <= b.length) {
      const len = dv.getUint32(off);
      const type = String.fromCharCode(b[off + 4], b[off + 5], b[off + 6], b[off + 7]);
      const data = b.subarray(off + 8, off + 8 + len);
      if (type === 'IHDR') ihdr = { width: dv.getUint32(off + 8), height: dv.getUint32(off + 12), bitDepth: b[off + 16], colorType: b[off + 17], interlace: b[off + 20] };
      else if (type === 'PLTE') plte = data;
      else if (type === 'tRNS') trns = true;
      else if (type === 'IDAT') { idat.push(data); total += data.length; }
      else if (type === 'IEND') break;
      off += 12 + len;
    }
    if (!ihdr || !idat.length) return null;
    const all = new Uint8Array(total); let p = 0;
    for (const d of idat) { all.set(d, p); p += d.length; }
    return { ...ihdr, plte, trns, idat: all };
  }

  const pipeBytes = async (bytes, stream) =>
    new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer());

  const paeth = (a, b, c) => {
    const p = a + b - c, pa = Math.abs(p - a), pb = Math.abs(p - b), pc = Math.abs(p - c);
    return pa <= pb && pa <= pc ? a : pb <= pc ? b : c;
  };

  function pngUnfilter(data, h, rowLen, bpp) {
    const out = new Uint8Array(rowLen * h);
    let prev = new Uint8Array(rowLen);
    for (let y = 0; y < h; y++) {
      const base = y * (rowLen + 1), ft = data[base];
      const cur = out.subarray(y * rowLen, (y + 1) * rowLen);
      for (let x = 0; x < rowLen; x++) {
        const a = x >= bpp ? cur[x - bpp] : 0, b = prev[x], c = x >= bpp ? prev[x - bpp] : 0;
        let v = data[base + 1 + x];
        if (ft === 1) v += a; else if (ft === 2) v += b; else if (ft === 3) v += (a + b) >> 1; else if (ft === 4) v += paeth(a, b, c);
        cur[x] = v;
      }
      prev = cur;
    }
    return out;
  }

  function pngFilter(raw, h, rowLen, bpp) {
    const out = new Uint8Array((rowLen + 1) * h);
    const cand = [0, 1, 2, 3, 4].map(() => new Uint8Array(rowLen));
    let prev = new Uint8Array(rowLen);
    for (let y = 0; y < h; y++) {
      const cur = raw.subarray(y * rowLen, (y + 1) * rowLen);
      for (let x = 0; x < rowLen; x++) {
        const a = x >= bpp ? cur[x - bpp] : 0, b = prev[x], c = x >= bpp ? prev[x - bpp] : 0, v = cur[x];
        cand[0][x] = v; cand[1][x] = v - a; cand[2][x] = v - b; cand[3][x] = v - ((a + b) >> 1); cand[4][x] = v - paeth(a, b, c);
      }
      let best = 0, bestSum = Infinity;
      for (let f = 0; f < 5; f++) {
        let s = 0; const cf = cand[f];
        for (let x = 0; x < rowLen && s < bestSum; x++) s += cf[x] < 128 ? cf[x] : 256 - cf[x];
        if (s < bestSum) { bestSum = s; best = f; }
      }
      out[y * (rowLen + 1)] = best;
      out.set(cand[best], y * (rowLen + 1) + 1);
      prev = cur;
    }
    return out;
  }

  async function embedPngCompact(pdf, bytes) {
    const png = parsePng(bytes);
    if (!png || png.interlace !== 0) return null;
    const { width: w, height: h, bitDepth: bd, colorType: ct } = png;
    const ctx = pdf.context;
    const image = (data, colors, cs, extra = {}, bpc = bd) => ctx.register(ctx.stream(data, {
      Type: 'XObject', Subtype: 'Image', Width: w, Height: h, ColorSpace: cs, BitsPerComponent: bpc,
      Filter: 'FlateDecode', DecodeParms: { Predictor: 15, Colors: colors, BitsPerComponent: bpc, Columns: w }, ...extra,
    }));

    // 透過なし・8bit以下：圧縮データをそのまま使う
    if ((ct === 0 || ct === 2 || ct === 3) && !png.trns && bd <= 8) {
      if (ct === 3) {
        if (!png.plte) return null;
        const hex = [...png.plte].map(v => v.toString(16).padStart(2, '0')).join('');
        const cs = ['Indexed', 'DeviceRGB', png.plte.length / 3 - 1, PDFHexString.of(hex)];
        return { ref: image(png.idat, 1, cs), width: w, height: h };
      }
      return { ref: image(png.idat, ct === 0 ? 1 : 3, ct === 0 ? 'DeviceGray' : 'DeviceRGB'), width: w, height: h };
    }

    // 透過あり、または 16bit：展開して 8bit の色と透過に分け、予測フィルタ付きで再圧縮
    const channels = { 0: 1, 2: 3, 4: 2, 6: 4 }[ct];
    if (channels && !png.trns && (bd === 8 || bd === 16)) {
      const bps = bd / 8, hasAlpha = ct === 4 || ct === 6, cch = hasAlpha ? channels - 1 : channels;
      const raw = pngUnfilter(await pipeBytes(png.idat, new DecompressionStream('deflate')), h, w * channels * bps, channels * bps);
      const color = new Uint8Array(w * h * cch), alpha = hasAlpha ? new Uint8Array(w * h) : null;
      let opaque = true;
      for (let i = 0, ci = 0, ai = 0; i < raw.length; ) {
        for (let k = 0; k < cch; k++) { color[ci++] = raw[i]; i += bps; }   // 16bit は上位バイトを使う
        if (hasAlpha) { const v = raw[i]; i += bps; alpha[ai++] = v; if (v !== 255) opaque = false; }
      }
      const pack = async (buf, ch) => pipeBytes(pngFilter(buf, h, w * ch, ch), new CompressionStream('deflate'));
      const cs = cch === 1 ? 'DeviceGray' : 'DeviceRGB';
      const extra = hasAlpha && !opaque ? { SMask: image(await pack(alpha, 1), 1, 'DeviceGray', {}, 8) } : {};
      return { ref: image(await pack(color, cch), cch, cs, extra, 8), width: w, height: h };
    }
    return null; // それ以外（インターレース・透明色指定など）は pdf-lib 標準の方式に任せる
  }

  function drawCompactImagePage(pdf, x) {
    const { w, h } = fitPage(x.width, x.height);
    const page = pdf.addPage([w, h]);
    const name = page.node.newXObject('Image', x.ref);
    page.pushOperators(pushGraphicsState(), concatTransformationMatrix(w, 0, 0, h, 0, 0), drawObject(name), popGraphicsState());
  }

  async function addImagePage(pdf, bytes, path) {
    // PNG（と可逆・透過あり WebP）は、サイズが膨らまない方式を先に試す
    let pngBytes = /\.png$/i.test(path) ? bytes : null;
    if (/\.webp$/i.test(path)) {
      const info = webpInfo(bytes);
      if (info.lossless || info.alpha) { try { pngBytes = (await normalizeViaCanvas(bytes, 'image/webp', 'image/png')).bytes; } catch {} }
    }
    if (pngBytes) {
      let compact = null;
      try { compact = await embedPngCompact(pdf, pngBytes); } catch {}
      if (compact) { drawCompactImagePage(pdf, compact); return; }
    }

    const isJpg = /\.jpe?g$/i.test(path);
    let orient = isJpg ? jpegOrientation(bytes) : 1;
    let img;
    try {
      if (/\.webp$/i.test(path)) {
        // PDF は WebP を直接扱えないため変換する（可逆・透過あり → PNG、それ以外 → JPEG）
        const info = webpInfo(bytes);
        const n = await normalizeViaCanvas(bytes, 'image/webp', info.lossless || info.alpha ? 'image/png' : 'image/jpeg');
        img = n.mime === 'image/png' ? await pdf.embedPng(n.bytes) : await pdf.embedJpg(n.bytes);
      } else if ([2, 4, 5, 7].includes(orient)) {
        const n = await normalizeViaCanvas(bytes, 'image/jpeg');
        img = await pdf.embedJpg(n.bytes); orient = 1;
      } else {
        img = isJpg ? await pdf.embedJpg(bytes) : await pdf.embedPng(bytes);
      }
    } catch {
      const n = await normalizeViaCanvas(bytes, isJpg ? 'image/jpeg' : 'image/png');
      img = n.mime === 'image/png' ? await pdf.embedPng(n.bytes) : await pdf.embedJpg(n.bytes);
      orient = 1;
    }
    const { w, h } = fitPage(img.width, img.height);
    if (orient === 6 || orient === 8) {
      const page = pdf.addPage([h, w]);
      if (orient === 6) page.drawImage(img, { x: 0, y: w, width: w, height: h, rotate: degrees(-90) });
      else page.drawImage(img, { x: h, y: 0, width: w, height: h, rotate: degrees(90) });
    } else if (orient === 3) {
      const page = pdf.addPage([w, h]);
      page.drawImage(img, { x: w, y: h, width: w, height: h, rotate: degrees(180) });
    } else {
      const page = pdf.addPage([w, h]);
      page.drawImage(img, { x: 0, y: 0, width: w, height: h });
    }
  }

  // ---- 日本語フォント（必要になったときだけ読み込む）----
  // pdf-lib 標準のサブセット化は日本語フォントで字が欠けるため、harfbuzz でサブセット化してから埋め込む
  const loaded = {};
  function loadB64Script(src, globalName) {
    if (loaded[globalName]) return Promise.resolve(loaded[globalName]);
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = () => {
        const bin = atob(window[globalName]);
        const u = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
        delete window[globalName];
        loaded[globalName] = u; resolve(u);
      };
      s.onerror = () => reject(new Error(`${src} を読み込めません`));
      document.head.appendChild(s);
    });
  }

  let hb = null;
  async function subsetFont(text) {
    const fontBytes = await loadB64Script('lib/font-bizudgothic.js', 'OPT_FONT_BIZUDGOTHIC');
    if (!hb) {
      const wasm = await loadB64Script('lib/hb-subset-wasm.js', 'OPT_HB_SUBSET_WASM');
      hb = (await WebAssembly.instantiate(wasm, {})).instance.exports;
    }
    const ptr = hb.malloc(fontBytes.byteLength);
    new Uint8Array(hb.memory.buffer).set(fontBytes, ptr);
    const blob = hb.hb_blob_create(ptr, fontBytes.byteLength, 2, 0, 0);
    const face = hb.hb_face_create(blob, 0);
    hb.hb_blob_destroy(blob);
    const input = hb.hb_subset_input_create_or_fail();
    const uset = hb.hb_subset_input_unicode_set(input);
    for (const ch of new Set(text + '□ ')) hb.hb_set_add(uset, ch.codePointAt(0));
    const sub = hb.hb_subset_or_fail(face, input);
    hb.hb_subset_input_destroy(input);
    if (!sub) { hb.hb_face_destroy(face); hb.free(ptr); throw new Error('フォントのサブセット化に失敗しました'); }
    const res = hb.hb_face_reference_blob(sub);
    const off = hb.hb_blob_get_data(res, 0), len = hb.hb_blob_get_length(res);
    const out = new Uint8Array(hb.memory.buffer).slice(off, off + len);
    hb.hb_blob_destroy(res); hb.hb_face_destroy(sub); hb.hb_face_destroy(face); hb.free(ptr);
    return out;
  }

  function addTextPages(pdf, font, text) {
    const { pageW, pageH, margin, size, lead, tab } = TEXT;
    const maxW = pageW - margin * 2;
    const lineH = size * lead;
    const supported = new Set(font.getCharacterSet());
    const clean = [...text.replace(/\r\n?/g, '\n').replace(/\t/g, ' '.repeat(tab))]
      .map(ch => ch === '\n' || supported.has(ch.codePointAt(0)) ? ch : '□').join('');

    // 1文字ずつ幅を測って折り返す
    const lines = [];
    for (const para of clean.split('\n')) {
      if (para === '') { lines.push(''); continue; }
      let line = '', w = 0;
      for (const ch of para) {
        const cw = font.widthOfTextAtSize(ch, size);
        if (w + cw > maxW && line) { lines.push(line); line = ''; w = 0; }
        line += ch; w += cw;
      }
      lines.push(line);
    }
    while (lines.length && lines[lines.length - 1] === '') lines.pop();
    if (!lines.length) lines.push('');

    const perPage = Math.floor((pageH - margin * 2) / lineH);
    for (let i = 0; i < lines.length; i += perPage) {
      const page = pdf.addPage([pageW, pageH]);
      lines.slice(i, i + perPage).forEach((ln, j) => {
        if (ln) page.drawText(ln, { x: margin, y: pageH - margin - size - j * lineH, size, font });
      });
    }
  }

  async function convert(item) {
    const pdf = await PDFDocument.create();
    pdf.setTitle(item.name.replace(/\.zip$/i, ''));
    const failed = [];
    // 先に全ファイルを読み、テキストで使う文字を集める
    const loadedEntries = [];
    for (const { path, entry } of item.entries) {
      try {
        const bytes = await entry.async('uint8array');
        loadedEntries.push(IMG_EXT.test(path) ? { path, bytes } : { path, text: decodeBytes(bytes) });
      } catch { failed.push(path); }
    }
    let font = null;
    const allText = loadedEntries.filter(e => e.text !== undefined).map(e => e.text).join('');
    if (loadedEntries.some(e => e.text !== undefined)) {
      pdf.registerFontkit(fontkit);
      font = await pdf.embedFont(await subsetFont(allText.replace(/\t/g, ' ')), { subset: false });
    }
    for (const e of loadedEntries) {
      try {
        if (e.bytes) await addImagePage(pdf, e.bytes, e.path);
        else addTextPages(pdf, font, e.text);
      } catch { failed.push(e.path); }
    }
    if (!pdf.getPageCount()) throw new Error('ページを作れませんでした');
    return { bytes: await pdf.save(), pages: pdf.getPageCount(), failed };
  }

  // ---- 保存 ----
  // ブラウザは「クリック直後」でないとファイル選択ダイアログを開けないため、
  // 保存先を先に決めてから変換する
  const pdfName = item => item.name.replace(/\.zip$/i, '') + '.pdf';
  const PDF_TYPES = [{ description: 'PDF', accept: { 'application/pdf': ['.pdf'] } }];

  async function pickDestination(targets) {
    if (targets.length === 1 && window.showSaveFilePicker) {
      return { kind: 'file', handle: await showSaveFilePicker({ suggestedName: pdfName(targets[0]), types: PDF_TYPES }) };
    }
    if (targets.length > 1 && window.showDirectoryPicker) {
      const dir = await showDirectoryPicker({ mode: 'readwrite' });
      const exists = [];
      for (const item of targets) {
        try { await dir.getFileHandle(pdfName(item)); exists.push(pdfName(item)); } catch {}
      }
      if (exists.length && !confirm(`次のファイルは同名のPDFがあるため上書きします。\n\n${exists.join('\n')}`)) {
        throw new DOMException('cancel', 'AbortError');
      }
      return { kind: 'dir', dir };
    }
    return { kind: 'download' };
  }

  async function writeResult(dest, r) {
    const blob = new Blob([r.bytes], { type: 'application/pdf' });
    if (dest.kind === 'file' || dest.kind === 'dir') {
      const h = dest.kind === 'file' ? dest.handle : await dest.dir.getFileHandle(pdfName(r.item), { create: true });
      const w = await h.createWritable(); await w.write(blob); await w.close();
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = pdfName(r.item); document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    await new Promise(res => setTimeout(res, 300));
  }

  async function run() {
    const targets = queue.filter(i => i.state === 'ready' || i.state === 'done' || i.state === 'fail');
    if (!targets.length) return;
    $('convert').disabled = true;

    let dest;
    try {
      dest = await pickDestination(targets);
    } catch (e) {
      if (e.name === 'AbortError') setStatus('保存をキャンセルしました。');
      else setStatus('保存先を選べませんでした: ' + (e.message || e), 'err');
      render();
      return;
    }

    let saved = 0;
    for (const [n, item] of targets.entries()) {
      item.state = 'working'; item.message = ''; render();
      setStatus(`変換中… ${n + 1} / ${targets.length}`);
      try {
        const r = await convert(item);
        item.pages = r.pages; item.failed = r.failed;
        item.message = r.failed.length ? `読み込めなかった${r.failed.length}件を除外` : '';
        await writeResult(dest, { item, ...r });
        item.state = 'done'; saved++;
      } catch (e) {
        item.state = 'fail'; item.message = e.message || String(e);
      }
      render();
    }

    const failedCount = targets.length - saved;
    if (!saved) {
      // 保存ダイアログで作られた空ファイルを片付ける（対応ブラウザのみ）
      if (dest.kind === 'file' && dest.handle.remove) { try { await dest.handle.remove(); } catch {} }
      setStatus('変換できたzipがありません。', 'err');
    } else {
      const where = dest.kind === 'file' ? `${dest.handle.name} を保存しました。`
        : dest.kind === 'dir' ? `${saved}件のPDFを「${dest.dir.name}」に保存しました。`
        : `${saved}件のPDFをダウンロードしました。`;
      setStatus(where + (failedCount ? ` ${failedCount}件は失敗しました。` : ''), failedCount ? 'err' : 'ok');
    }
    render();
  }

  // ---- 一覧 ----
  async function addFiles(fileList) {
    const files = [...fileList].filter(f => /\.zip$/i.test(f.name));
    const ignored = fileList.length - files.length;
    if (!files.length) { setStatus('zipファイルが含まれていません。', 'err'); return; }
    setStatus('zipを確認中…');
    let dup = 0;
    for (const file of files.sort((a, b) => collator.compare(a.name, b.name))) {
      if (queue.some(i => i.name === file.name && i.file.size === file.size)) { dup++; continue; }
      const item = { id: ++seq, file, name: file.name, entries: [], images: 0, texts: 0, skipped: [], state: 'ready', message: '' };
      queue.push(item);
      try { await inspectZip(item); }
      catch { item.state = 'error'; item.message = 'zipとして読み込めません（パスワード付きの可能性があります）'; }
      render();
    }
    const notes = [`${files.length - dup}件を追加しました。`];
    if (dup) notes.push(`同じzip${dup}件は追加していません。`);
    if (ignored) notes.push(`zip以外の${ignored}件は無視しました。`);
    setStatus(notes.join(' '));
  }

  function render() {
    const list = $('list'); list.innerHTML = '';
    if (!queue.length) {
      const li = document.createElement('li'); li.className = 'empty';
      li.textContent = 'まだzipがありません。上の枠にドロップしてください。';
      list.appendChild(li);
    }
    for (const item of queue) {
      const li = document.createElement('li'); li.className = 'item';
      const name = document.createElement('div'); name.className = 'name'; name.textContent = item.name; name.title = item.name;
      const detail = document.createElement('div');
      if (item.state === 'error') { detail.className = 'detail err'; detail.textContent = item.message; }
      else {
        detail.className = 'detail';
        const parts = [fmtSize(item.file.size), `画像${item.images}`, `テキスト${item.texts}`];
        if (item.skipped.length) parts.push(`対象外${item.skipped.length}`);
        if (item.pages) parts.push(`→ ${item.pages}ページ`);
        if (item.message) parts.push(item.message);
        detail.textContent = parts.join('　');
        if (item.state === 'fail') detail.classList.add('err');
      }
      const state = document.createElement('div'); state.className = 'state';
      const label = { ready: '', working: '変換中…', converted: '保存待ち', done: '保存済み', fail: '失敗', error: '' }[item.state];
      if (label) { const s = document.createElement('span'); s.textContent = label; if (item.state === 'done') s.className = 'done'; if (item.state === 'fail') s.className = 'fail'; state.appendChild(s); }
      const rm = document.createElement('button'); rm.textContent = '×'; rm.setAttribute('aria-label', `${item.name} を外す`);
      rm.disabled = item.state === 'working';
      rm.addEventListener('click', () => { queue = queue.filter(q => q !== item); render(); });
      state.appendChild(rm);
      li.append(name, state, detail);

      const extra = [...item.skipped.map(p => `対象外: ${p}`), ...(item.failed || []).map(p => `読み込み失敗: ${p}`)];
      if (extra.length) {
        const d = document.createElement('details'); d.className = 'skip';
        const s = document.createElement('summary'); s.textContent = '含めなかったファイル';
        const ul = document.createElement('ul');
        extra.forEach(t => { const x = document.createElement('li'); x.textContent = t; ul.appendChild(x); });
        d.append(s, ul); li.appendChild(d);
      }
      list.appendChild(li);
    }
    const ok = queue.filter(i => i.state !== 'error');
    $('count').textContent = queue.length ? `${queue.length}件` : '';
    $('convert').disabled = !ok.length || queue.some(i => i.state === 'working');
    $('clearAll').disabled = !queue.length;
    $('saveHint').textContent = ok.length > 1
      ? (window.showDirectoryPicker ? '保存先フォルダを選ぶと、zipと同じ名前のPDFをまとめて保存します。' : 'zipと同じ名前のPDFを1件ずつダウンロードします。')
      : 'zipと同じ名前のPDFで保存します。';
  }

  let depth = 0;
  const isFileDrag = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
  window.addEventListener('dragenter', e => { if (isFileDrag(e)) { depth++; document.body.classList.add('dragging'); } });
  window.addEventListener('dragleave', e => { if (isFileDrag(e) && --depth <= 0) { depth = 0; document.body.classList.remove('dragging'); } });
  window.addEventListener('dragover', e => { if (isFileDrag(e)) e.preventDefault(); });
  window.addEventListener('drop', e => { if (!isFileDrag(e)) return; e.preventDefault(); depth = 0; document.body.classList.remove('dragging'); addFiles(e.dataTransfer.files); });

  $('drop').addEventListener('click', () => $('picker').click());
  $('drop').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('picker').click(); } });
  $('picker').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
  $('clearAll').addEventListener('click', () => { queue = []; render(); setStatus(''); });
  $('convert').addEventListener('click', run);
  render();
})();
</script>
</body>
</html>
